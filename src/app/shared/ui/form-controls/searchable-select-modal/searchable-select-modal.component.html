<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Tutup</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [placeholder]="searchPlaceholder"
      [debounce]="0"
      (ionInput)="onSearch($event)"
      value="">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="full">
    @if (loading) {
      <div class="ion-padding ion-text-center">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Memuat...</p>
      </div>
    } @else if (filteredOptions.length === 0) {
      <div class="ion-padding ion-text-center">
        <ion-icon
          name="search-outline"
          style="font-size: 48px; color: var(--ion-color-medium);">
        </ion-icon>
        <p color="medium">{{ emptyText }}</p>
      </div>
    } @else {
      <ion-list-header>
        <ion-label>Hasil Pencarian</ion-label>
      </ion-list-header>

      @for (opt of filteredOptions; track opt.value) {
        <ion-item button detail="false" [color]="isSelected(opt) ? 'light' : undefined" (click)="select(opt)">
          <ion-label>
            <h3>{{ opt.label }}</h3>
          </ion-label>
          @if (isSelected(opt)) {
            <ion-icon name="checkmark-circle" slot="end" color="primary"></ion-icon>
          } @else {
            <ion-icon name="chevron-forward" slot="end" color="medium"></ion-icon>
          }
        </ion-item>
      }
    }
  </ion-list>
</ion-content>
